services:
  - type: web
    name: lab-01-express-server-252u1r8022
    runtime: node
    rootDir: lab-01
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

  - type: web
    name: lab-02-sqlite-server-252u1r8022
    runtime: node
    rootDir: lab-02
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

  - type: web
    name: lab-03-rest-api-252u1r8022
    runtime: node
